experiment:
  name: bert-mtl-nlp
  seed: 42
  output_dir: runs/nlp

backbone:
  type: bert
  pretrained: bert-base-uncased
  freeze_until_epoch: 1

data:
  max_seq_len: 128
  batch_size: 16
  num_workers: 2

train:
  epochs: 3
  lr: 2.0e-5
  weight_decay: 0.01
  log_every: 50

loss_weighting:
  strategy: uncertainty   # one of: uniform | uncertainty
