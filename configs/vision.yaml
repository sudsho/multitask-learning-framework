experiment:
  name: resnet-mtl-vision
  seed: 42
  output_dir: runs/vision

backbone:
  type: resnet50
  pretrained: true
  freeze_until_epoch: 0
  feature_dim: 2048

tasks:
  - name: classification
    head: avgpool_classifier
    num_classes: 20      # pascal voc 20 classes
    loss: ce
    weight_init: 1.0
  - name: segmentation
    head: fcn_decoder
    num_classes: 21      # 20 fg + bg
    loss: ce_ignore_255
    weight_init: 1.0

data:
  dataset: voc2012_subset
  image_size: 224
  batch_size: 8
  num_workers: 4

train:
  epochs: 5
  lr: 1.0e-3
  weight_decay: 5.0e-4
  momentum: 0.9
  log_every: 25

loss_weighting:
  strategy: gradnorm
  gradnorm:
    alpha: 1.5
    update_every: 1
