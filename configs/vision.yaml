experiment:
  name: resnet-mtl-vision
  seed: 42
  output_dir: runs/vision

backbone:
  type: resnet50
  pretrained: true
  freeze_until_epoch: 0

data:
  image_size: 224
  batch_size: 8
  num_workers: 4

train:
  epochs: 5
  lr: 1.0e-3
  weight_decay: 5.0e-4
  momentum: 0.9
  log_every: 25

loss_weighting:
  strategy: uncertainty   # one of: uniform | uncertainty
